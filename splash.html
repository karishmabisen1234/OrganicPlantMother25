<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #a8e063, lightgreen);
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    .logo-container {
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;

    .logo {

      height: 130px;
      margin-bottom: 10px;
      animation: zoom 1.5s ease-in-out infinite alternate;

      color: black;
      font-size: 26px;
      text-shadow: 0 0 8px rgba(255,255,255,0.7);
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoom {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>
</head>
