<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 Disease Severity Records — Multilingual</title>
<link rel="stylesheet" href="css/disease.css">
</head>
<body>
  <header>
    <h1><span class="leaf">🌿</span><span id="title">Disease Severity Records</span></h1>

    <div class="lang-select" aria-hidden="false">
      <label for="lang" style="display:none">Language</label>
      <select id="lang" class="lang" title="Select language">
        <!-- value keys correspond to translations object below -->
        <option value="en">English</option>
        <option value="hi">हिन्दी — Hindi</option>
        <option value="mr">मराठी — Marathi</option>
        <option value="gu">ગુજરાતી — Gujarati</option>
        <option value="ta">தமிழ் — Tamil</option>
        <option value="te">తెలుగు — Telugu</option>
        <option value="kn">ಕನ್ನಡ — Kannada</option>
        <option value="ml">മലയാളം — Malayalam</option>
        <option value="bn">বাংলা — Bengali</option>
        <option value="pa">ਪੰਜਾਬੀ — Punjabi</option>
        <option value="ur">اردو — Urdu</option>
        <option value="ne">नेपाली — Nepali</option>
      </select>
    </div>
  </header>

  <div class="table-container" role="region" aria-label="Disease table">
    <table id="diseaseTable" aria-live="polite">
      <thead>
        <tr>
          <th id="th-plant">Plant Name</th>
          <th id="th-disease">Disease</th>
          <th id="th-severity">Severity</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Rows generated by JS -->
      </tbody>
    </table>
  </div>

  <div class="btn-group" role="group" aria-label="Actions">
    <button class="btn back-btn" id="backBtn" onclick="goBack()">⬅ Back to Dashboard</button>
    <button class="btn download-btn" id="downloadBtn" onclick="downloadCSV()">⬇ Download Records (CSV)</button>
  </div>

  <footer id="footer">Made with 🌱 care by Karishma Bisen</footer>
<script src="js/disease.js"></script>
  </body>
</html>
