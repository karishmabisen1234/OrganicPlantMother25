<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 Disease Severity Records</title>
  <link rel="stylesheet" href="css/disease.css">
</head>
<body>

<header>
  <h1><span class="leaf">🌿</span><span id="title">Disease Severity Records</span></h1>

  <div class="lang-select">
    <select id="lang" class="lang">
      <option value="en">English</option>
    </select>
  </div>
</header>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th id="th-plant">Plant</th>
        <th id="th-disease">Disease</th>
        <th id="th-severity">Severity</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="btn-group">
  <button class="btn back-btn" onclick="goBack()">⬅ Back</button>
  <button class="btn download-btn" onclick="downloadCSV()">⬇ Download CSV</button>
</div>

<footer id="footer">Made by Karishma 🌱</footer>

<script src="js/disease.js"></script>
</body>
</html>
