<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Smart Plant Voice Chatbot</title>
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
<div class="chatbox">
<header>
  <span id="header-text">🌿 Plant Assistant</span>
  <select id="lang" onchange="changeLang()">
  <option value="en">English</option>
  <option value="hi">Hindi</option>
  <option value="mr">Marathi</option>
</select>
<button id="backBtn" onclick="goToDashboard()" style="margin-left:10px; padding:5px 10px; cursor:pointer;">
    ⬅ Back to Dashboard
  </button>
</header>

<div id="messages"></div>
<footer>
<input id="text" placeholder="Type or speak..." onkeydown="if(event.key==='Enter') sendText()"/>
<button class="send" onclick="sendText()">Send</button>
<button class="mic" onclick="startListening()">🎤</button>
<button class="stop" onclick="stopSpeaking()">⏹</button>
</footer>
<div id="options" class="options" style="padding:10px"></div>
</div>
<script src="js/chatbot.js"></script>

</body>
</html>
