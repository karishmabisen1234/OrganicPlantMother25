<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title data-i18n="title">🌿 Learn Disease — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="css/learn.css">
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1 data-i18n="title">🌿 Learn Disease</h1>
        <div class="desc" data-i18n="desc">
          Explore diseases for 100+ plants. Click "Listen" to hear disease, organic solution & prevention (female voice).
        </div>
      </div>

      <div class="controls">
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="mr">मराठी</option>
        </select>

        <input id="search" class="search" 
          data-i18n-placeholder="search" 
          placeholder="Search plant or disease (e.g. Tomato, Powdery)" />

        <select id="category" class="select" aria-label="Filter by category">
          <option value="">All categories</option>
          <option>Vegetable</option>
          <option>Fruit</option>
          <option>Flower</option>
          <option>Herb</option>
          <option>Medicinal</option>
          <option>Indoor</option>
          <option>Tree</option>
          <option>Spice</option>
        </select>

        <button id="clearBtn" class="btn" data-i18n="clear">Clear</button>
        <button class="themeBtn" id="themeToggle" title="Toggle theme"><i data-feather="moon"></i></button>
        <button class="btn" id="backBtn" title="Back to dashboard">← Dashboard</button>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite">
      <!-- cards injected here -->
    </div>

    <div id="empty" class="empty" style="display:none;margin-top:16px;">
      No results. Try a different search.
    </div>
  </div>

  <!-- Modal -->
  <div id="modalBack" class="modal-back" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <button class="close" id="modalClose" title="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/learn.js"></script>
</body>
</html>
